<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Tema scelto dall'utente: va applicato PRIMA del primo disegno, altrimenti chi usa il
      // tema chiaro vede un lampo scuro finche' la pagina non si "accende".
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Suppress non-Error uncaught exceptions and unhandled rejections.
      // Uses addEventListener (cannot be overridden by third-party scripts like GTM).
      // Targets: OGL WebGL errors, old libraries that throw strings/null/undefined.
      // Real application errors are always proper Error instances and pass through.
      window.addEventListener('error', function(e) {
        if (!e.error || !(e.error instanceof Error)) { e.preventDefault(); }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason == null || !(e.reason instanceof Error)) { e.preventDefault(); }
      });
    </script>
    <script>
      // Google tag: la coda e la configurazione restano subito qui (nessun evento si perde),
      // ma la libreria (~160 kB) si scarica a pagina caricata, per non contendere banda a
      // stili, caratteri e immagini del primo schermo.
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18003003969');
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18003003969';
        document.head.appendChild(s);
      });
    </script>
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="google-site-verification" content="VcNrLrBqzUI2ljwcUKeMvthK2DvlVMPKmB40NA-SrYI" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <!-- Nessun preconnect globale: ogni connessione anticipata costa una stretta di mano TLS
         anche nelle pagine che non usano quel server (contatti, servizi, chi siamo non scaricano
         nulla da fuori). Basta il dns-prefetch; chi serve un video o un'immagine da fuori sul
         primo schermo dichiara il proprio preconnect nel head della pagina. -->
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script async src="https://embeds.iubenda.com/widgets/e1754da6-3d43-4bb9-b05e-6f6ebf289a9a.js"></script>
  </body>
</html>
