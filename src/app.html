<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Tema scelto dall'utente: va applicato PRIMA del primo disegno, altrimenti chi usa il
      // tema chiaro vede un lampo scuro finche' la pagina non si "accende".
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Suppress non-Error uncaught exceptions and unhandled rejections.
      // Uses addEventListener (cannot be overridden by third-party scripts like GTM).
      // Targets: OGL WebGL errors, old libraries that throw strings/null/undefined.
      // Real application errors are always proper Error instances and pass through.
      window.addEventListener('error', function(e) {
        if (!e.error || !(e.error instanceof Error)) { e.preventDefault(); }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason == null || !(e.reason instanceof Error)) { e.preventDefault(); }
      });
    </script>
    <script>
      // Google tag (Ads) e Consent Mode v2, in regola con il GDPR: il consenso e' NEGATO prima di qualunque altra
      // istruzione (la configurazione, che segue, non puo' piu' partire con un consenso implicito) e la libreria
      // di Google (~160 kB) non viene nemmeno scaricata finche' iubenda non comunica un consenso concesso
      // (consent update granted): chi rifiuta, o non sceglie, non contatta Google e non riceve cookie (_gcl_au).
      // Chi ha gia' acconsentito in una visita precedente: iubenda rimanda la sua scelta a ogni pagina e la
      // libreria parte a pagina caricata, come prima. La coda degli eventi resta qui, nulla si perde.
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied',
        functionality_storage: 'denied', personalization_storage: 'denied', security_storage: 'granted'
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('js', new Date());
      gtag('config', 'AW-18003003969');
      (function () {
        var caricata = false;
        function caricaGoogleTag() {
          if (caricata) return;
          caricata = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18003003969';
          document.head.appendChild(s);
        }
        var spingi = dataLayer.push;
        dataLayer.push = function () {
          var r = spingi.apply(dataLayer, arguments);
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            if (a && a[0] === 'consent' && a[1] === 'update' && a[2] && (a[2].ad_storage === 'granted' || a[2].analytics_storage === 'granted')) caricaGoogleTag();
          }
          return r;
        };
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="google-site-verification" content="VcNrLrBqzUI2ljwcUKeMvthK2DvlVMPKmB40NA-SrYI" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <!-- Caratteri del primo schermo: i quattro pesi dritti che compaiono subito (400 testo,
         500 menu, 600 pulsanti, 700 titoli). Sono gli unici preload: gli altri pesi e i corsivi
         si scaricano solo quando una pagina li usa. Senza l'anticipo partono dopo l'analisi del
         CSS e, con i loghi in coda, arrivano oltre un secondo dopo il testo di riserva. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/DegularDisplay-Regular_1768475446675.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/DegularDisplay-Medium_1768475446675.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/DegularDisplay-Semibold_1768475446675.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/DegularDisplay-Bold_1768475446675.woff2" />
    <!-- Nessun preconnect globale: ogni connessione anticipata costa una stretta di mano TLS
         anche nelle pagine che non usano quel server (contatti, servizi, chi siamo non scaricano
         nulla da fuori). Basta il dns-prefetch; chi serve un video o un'immagine da fuori sul
         primo schermo dichiara il proprio preconnect nel head della pagina. -->
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script async src="https://embeds.iubenda.com/widgets/e1754da6-3d43-4bb9-b05e-6f6ebf289a9a.js"></script>
  </body>
</html>
